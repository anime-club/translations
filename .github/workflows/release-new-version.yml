name: Release new version
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-new-version.yml"
      - "src/**"
      - "types/**"
      - "package.json"

permissions:
  contents: write
  id-token: write

jobs:
  updateVersion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run config typecheck

      - name: Publish and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Latest tag is the version source of truth, so no version-bump commit is pushed back to main.
          latestTag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$latestTag" ]; then
            npm version "${latestTag#v}" --no-git-tag-version --allow-same-version
          fi
          nextTag=$(npm version patch --no-git-tag-version)
          npm publish --provenance
          gh release create "$nextTag" --target "$GITHUB_SHA" --generate-notes
